<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
    
    <defs>
      <linearGradient id="chromeGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#121713"/>
        <stop offset="100%" stop-color="#0e1310"/>
      </linearGradient>
      <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0d120e"/>
        <stop offset="100%" stop-color="#0B0F0C"/>
      </linearGradient>
      <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
        <feGaussianBlur stdDeviation="3.2" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
      <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
        <rect width="4" height="4" fill="transparent"/>
        <line x1="0" y1="0" x2="4" y2="0" stroke="#000000" stroke-opacity="0.35" stroke-width="1"/>
      </pattern>
      <radialGradient id="vignette" cx="50%" cy="35%" r="75%">
        <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
      </radialGradient>
    </defs>
    
    
    <rect x="1" y="1" width="898" height="298" rx="12" fill="url(#bodyGrad)"
          stroke="#1C2A1E" stroke-width="1.4"/>
    
    <rect x="0" y="0" width="900" height="34" rx="10" fill="url(#chromeGrad)"/>
    <rect x="0" y="18" width="900" height="16" fill="url(#chromeGrad)"/>
    <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
    <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
    <circle cx="62" cy="17" r="6" fill="#27c93f"/>
    <text x="450.0" y="22" text-anchor="middle" font-family="Consolas,'Courier New',monospace"
          font-size="12" fill="#6b7d70">rohit@JavaTypedScript: ~</text>
    <line x1="0" y1="34" x2="900" y2="34" stroke="#1C2A1E" stroke-width="1"/>
    
    

    <g font-family="Consolas,'Courier New',monospace">
      <text x="40" y="90" font-size="16" fill="#0DBF33">guest@JavaTypedScript:~$ whoami</text>

      <text x="40" y="150" font-size="52" font-weight="700" fill="#00FF41" filter="url(#glow)"
            letter-spacing="3">ROHIT R BHAT</text>

      <text x="42" y="182" font-size="18" fill="#39FF14" opacity="0.9">&gt; aka JavaTypedScript</text>
      <text x="42" y="210" font-size="14" fill="#6b7d70">"Code when Bored"</text>

      <text x="40" y="250" font-size="13" fill="#0DBF33">repos: 22   stars_given: 13   status: online   uptime: still compiling myself...</text>

      <text x="40" y="272" font-size="14" fill="#39FF14">guest@JavaTypedScript:~$ <tspan fill="#00FF41">█<animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="1s" repeatCount="indefinite"/></tspan></text>
    </g>

    
    <rect x="0" y="34" width="900" height="266" fill="url(#scan)" opacity="0.5">
      <animate attributeName="opacity" values="0.35;0.55;0.35" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="900" height="300" rx="12" fill="url(#vignette)"/>
    
    
    <rect x="0" y="0" width="900" height="300" rx="13" fill="none"
          stroke="#00FF41" stroke-opacity="0.25" stroke-width="2" filter="url(#glow)"/>
    
    </svg>